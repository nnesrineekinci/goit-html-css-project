<header class="header">
  <div class="container">
    <div class="header-inner">
      <a class="logo" href="./index.html">Focus.Frame</a>

      <nav class="desktop-nav" aria-label="Main navigation">
        <ul class="desktop-nav-list">
          <li><a class="desktop-nav-link" href="#about-us">About us</a></li>
          <li><a class="desktop-nav-link" href="#courses">Our courses</a></li>
          <li><a class="desktop-nav-link" href="#mentors">Our mentors</a></li>
          <li><a class="desktop-nav-link" href="#reviews">Reviews</a></li>
          <li><a class="desktop-nav-link" href="#contacts">Contacts</a></li>
        </ul>
      </nav>

      <a class="desktop-signup" href="#signup">Sign up</a>

      <div class="mobile-controls">
        <a
          class="camera-link"
          href="#signup"
          aria-label="Go to sign up section"
        >
          <svg
            class="camera-icon"
            width="20"
            height="20"
            aria-hidden="true"
          >
            <use href="/src/images/icons.svg#icon-camera"></use>
          </svg>
        </a>

        <input
          class="menu-toggle"
          type="checkbox"
          id="menu-toggle"
        >

        <label class="menu-button" for="menu-toggle">
          <span class="menu-line"></span>
          <span class="menu-line"></span>
          <span class="menu-line"></span>
          <span class="visually-hidden">Open navigation menu</span>
        </label>

        <div class="mobile-menu">
          <label class="mobile-menu-close" for="menu-toggle">
            ×
            <span class="visually-hidden">Close navigation menu</span>
          </label>

          <nav class="mobile-nav" aria-label="Mobile navigation">
            <ul class="mobile-nav-list">
              <li><a class="mobile-nav-link" href="#about-us">About us</a></li>
              <li><a class="mobile-nav-link" href="#courses">Our courses</a></li>
              <li><a class="mobile-nav-link" href="#mentors">Our mentors</a></li>
              <li><a class="mobile-nav-link" href="#reviews">Reviews</a></li>
              <li><a class="mobile-nav-link" href="#contacts">Contacts</a></li>
            </ul>
          </nav>

          <div class="mobile-menu-image">
            <img
              src="/src/images/menu-camera.png"
              srcset="
                /src/images/menu-camera.png 1x,
                /src/images/menu-camera@2x.png 2x
              "
              alt="Camera"
              loading="lazy"
            >
          </div>
        </div>

        <label class="menu-overlay" for="menu-toggle">
          <span class="visually-hidden">Close navigation menu</span>
        </label>
      </div>
    </div>
  </div>
</header>
